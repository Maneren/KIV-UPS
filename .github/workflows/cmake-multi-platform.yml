name: CMake on multiple platforms

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    # Only Linux is supported due to the use of the GNU extension of the BSD
    # sockets.
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - c_compiler: gcc-15
            cpp_compiler: g++-15
          - c_compiler: clang-22
            cpp_compiler: clang++-22

    steps:
      - uses: actions/checkout@v5
      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Configure via Just
        shell: bash
        run: >
          just configure "Ninja Multi-Config" \
              "-DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}" \
              "-DCMAKE_C_COMPILER=${{ matrix.c_compiler }}"

      - name: Build via Just
        run: just build

      - name: Test via Just
        run: just test
